<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기억윤슬 디자인</title>
<style>
  :root{--bg:#f6f0e6;--ink:#2c4a3a;--line:#e4d9c8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
  header{max-width:920px;margin:0 auto;padding:28px 20px 12px}
  header a{color:var(--ink);font-size:14px}
  h1{font-size:28px;margin:10px 0 4px}
  .tag{margin:0 0 8px;font-size:15px;opacity:.8}
  figure{max-width:920px;margin:0 auto 36px;padding:0 20px}
  figure img{width:100%;height:auto;display:block;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(44,74,58,.08)}
  figcaption{margin-top:10px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<header>
  <a href="./">← 체험 데모</a>
  <h1>기억윤슬</h1>
  <p class="tag">기억을 가장 개인답게 돌보는 방법</p>
</header>
<figure>
  <img src="landing.jpg" alt="기억윤슬 랜딩과 앱 홈">
  <figcaption>랜딩 · 앱 홈</figcaption>
</figure>
<figure>
  <img src="app-flow.jpg" alt="기초기록부터 구독·배송까지 앱 흐름">
  <figcaption>기초기록 · AI 생성 · 미리보기 · 앨범 · 구독</figcaption>
</figure>
<figure>
  <img src="book-page.jpg" alt="시지각 훈련, 보리와 함께 찾기">
  <figcaption>인지북 한 장 — 보리와 함께 찾기</figcaption>
</figure>
</body>
</html>
